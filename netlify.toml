# Asterveil: Rise Beyond, web demo (Stage 1). This branch holds only the built game;
# Netlify serves it as-is (no build step). Rebuilt with tools/web/build_web.sh and
# published with tools/web/publish_web_build.sh on the main development branch.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/*.pck"
  [headers.values]
    Content-Type = "application/octet-stream"

# The game files keep their names between builds, so the browser must check for a newer
# copy on every visit.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
