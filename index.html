<!DOCTYPE html>
<html lang="en">
	<head>
<!-- Asterveil web build (2026-10-10): a 3x phone screen made the canvas so large that Safari
     dropped the game's WebGL context. The page reports at most 2 device pixels per point, or 1
     with "?lite" in the address (the light mode offered by the graphics-lost notice). -->
<script>
(function () {
	// The getter lives on window itself in some browsers and on Window.prototype in others.
	var real = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio') || Object.getOwnPropertyDescriptor(Window.prototype, 'devicePixelRatio');
	var initial = window.devicePixelRatio || 1;
	var cap = /[?&]lite\b/.test(location.search) ? 1 : 2;
	var read = real && real.get ? function () { return real.get.call(window); } : function () { return initial; };
	try {
		Object.defineProperty(window, 'devicePixelRatio', { configurable: true, get: function () { return Math.min(read(), cap); } });
	} catch (e) { /* keep the browser's own value */ }
})();
</script>

		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Asterveil Rise Beyond</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #080c1e;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;

<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":58134532,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	<!-- Asterveil web build (2026-10-10): if the browser drops the game's graphics (usually a phone
     running out of memory), say so with a reload button instead of leaving a black screen.
     The last errors are listed so a screenshot tells us what happened. -->
<div id="av-alert" style="display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);max-width:84vw;padding:18px 22px;background:#141a33;color:#f4ecd8;border:1px solid #c9a75a;border-radius:12px;font:16px/1.5 -apple-system,'Noto Sans Thai',sans-serif;text-align:center;z-index:10"></div>
<script>
(function () {
	var box = document.getElementById('av-alert');
	var errors = [];
	var keep = function (text) { errors.push(String(text).slice(0, 240)); if (errors.length > 20) errors.shift(); };
	var original = console.error;
	console.error = function () { keep(Array.prototype.join.call(arguments, ' ')); return original.apply(console, arguments); };
	window.addEventListener('error', function (e) { keep(e.message); });
	window.addEventListener('unhandledrejection', function (e) { keep(e.reason); });
	var show = function (message) {
		var list = errors.slice(-6).map(function (e) { return e.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }).join('<br>');
		var button = 'margin:14px 6px 0;padding:10px 22px;font-size:17px;border-radius:8px;border:0;color:#fff;';
		var lite = /[?&]lite\b/.test(location.search);
		box.innerHTML = message + '<br><button onclick="location.reload()" style="' + button + 'background:#6a4fd0">โหลดใหม่</button>'
			+ (lite ? '' : '<button onclick="location.search=\'?lite\'" style="' + button + 'background:#3a4a7a">เล่นแบบภาพเบา</button>')
			+ (list ? '<div style="margin-top:12px;font-size:11px;opacity:.65;text-align:left;max-height:28vh;overflow:auto">' + list + '</div>' : '');
		box.style.display = 'block';
	};
	var canvas = document.getElementById('canvas');
	if (canvas) {
		canvas.addEventListener('webglcontextlost', function () {
			show('กราฟิกของเบราว์เซอร์หยุดทำงาน<br><span style="font-size:14px;opacity:.8">หน่วยความจำของเครื่องอาจไม่พอ ลองปิดแท็บอื่นแล้วโหลดใหม่</span>');
		});
	}
})();
</script>
</body>
</html>
